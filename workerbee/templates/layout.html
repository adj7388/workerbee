<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>{% block title %}Bee Word Play{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='site.css')}}" />
  </head>
  <body class="appcolor">
    <!-- Fixed navbar -->
    <nav class="navbar navbar-expand-sm navbar-light bg-light fixed-top">
      <div class="container-fluid">
        <span style="font-weight:bold; font-size:larger">Bee Word Play&nbsp;&nbsp;</span>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMenu"
                aria-controls="navbarMenu" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarMenu">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a 
                class="nav-link {% if request.endpoint == 'home' %}active{% endif %}" 
                href="{{ url_for('home') }}">Find Words
              </a>
            </li>
            <li class="nav-item">
              <a 
                class="nav-link {% if request.endpoint == 'summary_form' %}active{% endif %}" 
                href="{{ url_for('summary_form') }}">Show Summaries
              </a>
            </li>
            <li class="nav-item">
              <a 
                class="nav-link {% if request.endpoint == 'help' %}active{% endif %}" 
                href="{{ url_for('help') }}">Help
              </a>
            </li> 
            <li class="nav-item">
              <a
                class="nav-link {% if request.endpoint == 'about' %}active{% endif %}" 
                href="{{ url_for('about') }}">About
              </a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Page content -->
    <div>
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <p class="alert alert-warning">{{ message }}</p>
                {% endfor %}
            {% endif %}
        {% endwith %}
    </div>
    <div class="body-content">
        {% block content %}
        {% endblock %}
    </div>
    <div>
        <hr/>
            <footer>
                <p>&nbsp;&copy;2025 - Alan Johnston</p>
            </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
