{% extends LAYOUT_TEMPLATE %}

{% from MACROS_TEMPLATE import page_banner, show_metadata, word_row %}

{% block content %}

    {{ page_banner(text='List Results') }}
    {{ show_metadata(metadata) }}
    <div>
        <table>
            {% for beeword in beeword_list %}
                {{ word_row(beeword=beeword) }}
            {% endfor %}
        </table>
    </div>
{% endblock %}
