{% extends "layout.html" %}

{% from "macros.html" import page_banner, dictionary_dropdown, letter_inputs %}

{% block content %}
    {{ page_banner(text='Find Words') }}
    <form id="searchForm" method="GET">
        {% if PROFILING is true %}
            <input type="hidden" name="{{ PROFILE_REQUEST_ARG }}" value="true">
        {% endif %}

        {{ letter_inputs() }}

        <div class="mt-3">
            <label for="{{ WORD_LIST }}">Search word list:</label>
            <select id="{{ WORD_LIST }}" name="{{ WORD_LIST }}">
                {% for k, v in WORDLISTS.items() %}
                   <option value="{{ k }}"
                        {% if session[ARGS][WORD_LIST] == k %}
                            selected
                        {% endif %}
                    >
                    {{ v.name }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <div class="h6 mt-3">
            Group the results:
        </div>
        <div>
            <input type="radio" name="{{ GROUPING }}" id="{{ INITIALS }}" value="{{ INITIALS }}" 
                {{ "checked" if session[ARGS][GROUPING] == INITIALS else "" }}
            >
            <label for="{{ INITIALS }}">By initial letters</label>&nbsp;&nbsp;

            <input type="radio" name="{{ GROUPING }}" id="{{ LENGTH }}" value="{{ LENGTH }}" 
                {{ "checked" if session[ARGS][GROUPING] == LENGTH else "" }}
            >
            <label for="{{ LENGTH }}">By word length</label>&nbsp;&nbsp;

            <input type="radio" name="{{ GROUPING }}" id="{{ NO_GROUPING }}" value="{{ NO_GROUPING }}" 
                {{ "checked" if session[ARGS][GROUPING] == NO_GROUPING else "" }}
            >
            <label for="{{ NO_GROUPING }}">No grouping</label>
        </div>
        <div class="mt-3">
            <label for="{{ DICTIONARY }}">Link words to:</label>
            {{ dictionary_dropdown() }}
        </div>
        <div class="mt-3">
            <input id="submitButton" type="submit" value="Find Words">
        </div>
    </form>

    <div id="results"></div>

    <script>
        document.getElementById('searchForm').addEventListener('submit', function (e) {
            const submitButton = document.getElementById('submitButton').value = 'Update Results';
            e.preventDefault();
            const word_list = document.getElementById('{{WORD_LIST}}').value;
            const required = document.getElementById('{{REQUIRED_LETTER}}').value;
            const allowed = document.getElementById('{{ALLOWED_LETTERS}}').value;
            const grouping = document.querySelector('input[name="{{ GROUPING }}"]:checked')?.value;
            const dictionary = document.getElementById('{{DICTIONARY}}').value;
            query = `word_list=${word_list}&required=${required}&allowed=${allowed}&grouping=${grouping}&dictionary=${dictionary}`;
            fetch(`/_beeword-results?${query}`)
            .then(res => res.text())
            .then(html => {
                document.getElementById('results').innerHTML = html;
            });
        });
  </script>

{% endblock %}
