{% extends "layout.html" %}

{% from "macros.html" import page_banner, dictionary_dropdown, letter_inputs %}

{% block content %}
    {{ page_banner(text='Find Words') }}
    <form id="searchForm" method="GET">
        {% if PROFILING is true %}
            <input type="hidden" name="{{ PROFILE_REQUEST_ARG }}" value="true">
        {% endif %}

        {{ letter_inputs() }}

        <div class="d-flex flex-wrap align-items-center gap-3 mt-2">
                <label class="input-labels" for="{{ WORD_LIST }}">Use word list:</label>
                <select id="{{ WORD_LIST }}" name="{{ WORD_LIST }}">
                    {% for k, v in WORDLISTS.items() %}
                    <option value="{{ k }}"
                            {% if session[ARGS][WORD_LIST] == k %}
                                selected
                            {% endif %}
                        >
                        {{ v.name }}
                        </option>
                    {% endfor %}
                </select>
        </div>


        <div class="d-flex flex-wrap align-items-center gap-3 mt-2">
            <div class="input-labels">
                Group the results by:
            </div>
            <div class="d-inline-flex flex-nowrap gap-2">
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="{{ GROUPING }}" id="{{ INITIALS }}" value="{{ INITIALS }}" 
                        {{ "checked" if session[ARGS][GROUPING] == INITIALS else "" }}>
                    <label class="form-check-label" for="{{ INITIALS }}">Initial letters</label>&nbsp;&nbsp;
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="{{ GROUPING }}" id="{{ LENGTH }}" value="{{ LENGTH }}" 
                        {{ "checked" if session[ARGS][GROUPING] == LENGTH else "" }}>
                    <label class="form-check-label" for="{{ LENGTH }}">Word length</label>&nbsp;&nbsp;
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="{{ GROUPING }}" id="{{ NO_GROUPING }}" value="{{ NO_GROUPING }}" 
                        {{ "checked" if session[ARGS][GROUPING] == NO_GROUPING else "" }}>
                    <label class="form-check-label" for="{{ NO_GROUPING }}">No grouping</label>
                </div>
            </div>
        </div>
        <div class="mt-2">
            <label class="input-labels" for="{{ DICTIONARY }}">Link words to:</label>
            {{ dictionary_dropdown() }}
        </div>
        <div class="mt-3">
            <input id="submitButton" type="submit" value="Find Words">
        </div>
    </form>

    <div id="results"></div>

    <script>
        document.getElementById('searchForm').addEventListener('submit', function (e) {
            const submitButton = document.getElementById('submitButton').value = 'Update Results';
            e.preventDefault();
            const word_list = document.getElementById('{{WORD_LIST}}').value;
            const required = document.getElementById('{{REQUIRED_LETTER}}').value;
            const allowed = document.getElementById('{{ALLOWED_LETTERS}}').value;
            const grouping = document.querySelector('input[name="{{ GROUPING }}"]:checked')?.value;
            const dictionary = document.getElementById('{{DICTIONARY}}').value;
            query = `word_list=${word_list}&required=${required}&allowed=${allowed}&grouping=${grouping}&dictionary=${dictionary}`;
            fetch(`/_findwords-results?${query}`)
            .then(res => res.text())
            .then(html => {
                document.getElementById('results').innerHTML = `
                    <div class="mt-3 bg-light" style="padding: 1em; border-top: 1px solid #333;">
                        ${html}
                    </div>`;
            });
        });
  </script>

{% endblock %}
